<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report an Issue - UniCare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>UniCare</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="report.html" class="active">Report an Issue</a>
            <a href="resolved.html">Recent Fixes</a>
            <a href="lost-found.html">Lost & Found</a>
            <a href="emergency.html">Emergency Contacts</a>
        </nav>
    </header>

    <main>
        <h2>Report an Issue</h2>
        <p class="intro-text">Fill out this form to report an issue on campus.</p>

        <form id="report-form">
            <div class="form-group">
                <label for="title">Problem Title *</label>
                <input type="text" id="title" placeholder="e.g. Fan not working, Water leakage" required>
            </div>

            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" required>
                    <option value="">-- Select Category --</option>
                    <option value="Hostel">Hostel</option>
                    <option value="Mess">Mess</option>
                    <option value="Classroom">Classroom</option>
                    <option value="WiFi">WiFi</option>
                    <option value="Others">Others</option>
                </select>
            </div>

            <div class="form-group">
                <label for="location">Location *</label>
                <input type="text" id="location" placeholder="e.g., Block 34, Room 201" required>
            </div>

            <div class="form-group">
                <label for="image">Attach Photo (Optional)</label>
                <input type="file" id="image" accept="image/*">
            </div>

            <div class="form-group">
                <label for="description">Description *</label>
                <textarea id="description" rows="4" placeholder="Briefly describe the problem..." required></textarea>
            </div>

            <button type="submit" class="btn btn-submit">Submit Report</button>
        </form>

        <hr class="divider">

        <h2>Recently Reported Issues</h2>
        <div id="issue-list"></div>
    </main>

    <footer>
        <p>&copy; 2026 UniCare | Campus Problem Reporting System | B.Tech CSE Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
