<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Fixes & Status - UniCare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>UniCare</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="report.html">Report an Issue</a>
            <a href="resolved.html" class="active">Recent Fixes</a>
            <a href="lost-found.html">Lost & Found</a>
            <a href="emergency.html">Emergency Contacts</a>
        </nav>
    </header>

    <main>
        <h2>Recent Fixes and Status</h2>
        <p class="intro-text">Check the status of campus issues or view the queries you submitted.</p>

        <div class="filter-container">
            <button class="filter-btn active" id="filter-all" onclick="filterFixes('all')">All Issues</button>
            <button class="filter-btn my-query-btn" id="filter-my-queries" onclick="filterFixes('my-queries')">My Queries</button>
            <button class="filter-btn" id="filter-pending" onclick="filterFixes('Pending')">Pending</button>
            <button class="filter-btn" id="filter-progress" onclick="filterFixes('In Progress')">In Progress</button>
            <button class="filter-btn" id="filter-resolved" onclick="filterFixes('Resolved')">Resolved</button>
        </div>

        <div id="fixes-list"></div>
    </main>

    <footer>
        <p>&copy; 2026 UniCare | Campus Problem Reporting System | B.Tech CSE Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
