<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found - UniCare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>UniCare</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="report.html">Report an Issue</a>
            <a href="resolved.html">Recent Fixes</a>
            <a href="lost-found.html" class="active">Lost & Found</a>
            <a href="emergency.html">Emergency Contacts</a>
        </nav>
    </header>

    <main>
        <h2>Lost and Found</h2>
        <p class="intro-text">Post details about lost or found items on campus.</p>

        <form id="lost-found-form">
            <div class="form-group">
                <label for="itemStatus">Status *</label>
                <select id="itemStatus" required>
                    <option value="">-- Select Status --</option>
                    <option value="Lost">Lost</option>
                    <option value="Found">Found</option>
                </select>
            </div>

            <div class="form-group">
                <label for="itemName">Item Name *</label>
                <input type="text" id="itemName" placeholder="e.g. Blue Laptop Charger, ID Card" required>
            </div>

            <div class="form-group">
                <label for="itemLocation">Location *</label>
                <input type="text" id="itemLocation" placeholder="e.g., Block 34, Room 201" required>
            </div>

            <div class="form-group">
                <label for="itemImage">Attach Photo (Optional)</label>
                <input type="file" id="itemImage" accept="image/*">
            </div>

            <div class="form-group">
                <label for="itemDescription">Description and Contact Info *</label>
                <textarea id="itemDescription" rows="4" placeholder="Describe the item and your contact number or room..." required></textarea>
            </div>

            <button type="submit" class="btn btn-submit">Submit Item</button>
        </form>

        <hr class="divider">

        <h2>Lost and Found Items</h2>
        <div id="lost-found-list"></div>
    </main>

    <footer>
        <p>&copy; 2026 UniCare | Campus Problem Reporting System | B.Tech CSE Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
